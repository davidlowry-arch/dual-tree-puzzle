<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual-Tree Hashi Puzzle Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="puzzleCanvas" width="380" height="440"></canvas>
    </div>
    
<div id="controls">
    <button id="btn-green" class="active">Green Tree</button>
    <button id="btn-brown">Brown Tree</button>
    <button id="btn-hint" style="background-color: #f1c40f; color: #2c3e50; font-weight: bold;">Hint</button>
    <button id="btn-new" style="background-color: #34495e; color: white;">New</button>
</div>

    <script src="script.js"></script>
</body>
</html>
