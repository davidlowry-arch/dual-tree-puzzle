<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Tree Puzzle Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="puzzleCanvas" width="800" height="600"></canvas>
    </div>
    
<div id="controls">
    <button id="btn-green" class="active">Draw Green Tree (Hex)</button>
    <button id="btn-brown">Draw Brown Tree (Tri)</button>
    <button id="btn-hint" style="background-color: #f1c40f; color: #2c3e50; font-weight: bold;">Hint</button>
    <button id="btn-new" style="background-color: #34495e; color: white;">New Puzzle</button>
</div>

    <script src="script.js"></script>
</body>
</html>
